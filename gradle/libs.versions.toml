[versions]
agp = "7.4.2"
protobuf-plugin = "0.8.17"
kotlin = "1.6.0"
recyclerview = "1.2.1"
appcompat = "1.4.0"
lifecycle-runtime = "2.4.0-alpha03"
lifecycle-extensions = "2.2.0"
constraintlayout = "2.0.1"
cardview = "1.0.0"
material = "1.6.1"
core-ktx = "1.3.1"
leanback = "1.1.0-alpha04"
core-runtime = "2.1.0"
car_ui_lib = "2.6.0"
navigation = "2.4.0-alpha01"
preference = "1.1.1"
leanback-preference = "1.1.0-alpha04"
protobuf-java = "3.5.1"
protoc = "3.5.1"

[libraries]
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle-runtime" }
lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycle-extensions" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
constraintlayout-solver = { module = "androidx.constraintlayout:constraintlayout-solver", version.ref = "constraintlayout" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
leanback = { module = "androidx.leanback:leanback", version.ref = "leanback" }
core-runtime = { module = "androidx.arch.core:core-runtime", version.ref = "core-runtime" }
car_ui_lib = { module = "com.android.car.ui:car-ui-lib", version.ref = "car_ui_lib" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
leanback-preference = { module = "androidx.leanback:leanback-preference", version.ref = "leanback-preference" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-java" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protoc" }

navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
navigation-common-ktx = { module = "androidx.navigation:navigation-common-ktx", version.ref = "navigation" }
navigation-runtime-ktx = { module = "androidx.navigation:navigation-runtime-ktx", version.ref = "navigation" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin" }
kotlinx_coroutines_core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin" }
kotlin_reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }