// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '1.6.0'

        libs = [
                recyclerview              : 'androidx.recyclerview:recyclerview:1.2.1',
                legacy_support_v4         : 'androidx.legacy:legacy-support-v4:1.0.0',
                appcompat                 : 'androidx.appcompat:appcompat:1.3.0-alpha01',
                annotation                : 'androidx.annotation:annotation:1.1.0',
                mediarouter               : 'androidx.mediarouter:mediarouter:1.2.0-alpha01',
                lifecycle_runtime         : 'androidx.lifecycle:lifecycle-runtime:2.3.0-alpha05',
                lifecycle_extensions      : 'androidx.lifecycle:lifecycle-extensions:2.0.0-alpha1',
                palette                   : 'androidx.palette:palette:1.0.0',
                constraintlayout          : 'androidx.constraintlayout:constraintlayout:2.0.1',
                constraintlayout_solver   : 'androidx.constraintlayout:constraintlayout-solver:2.0.1',
                leanback                  : 'androidx.leanback:leanback:1.1.0-alpha04',
                preference_leanback       : 'androidx.leanback:leanback-preference:1.1.0-alpha04',
                slice_builders            : 'androidx.slice:slice-builders:1.1.0-alpha02',
                slice_core                : 'androidx.slice:slice-core:1.1.0-alpha02',
                slice_view                : 'androidx.slice:slice-view:1.1.0-alpha02',
                core_runtime              : 'androidx.arch.core:core-runtime:2.1.0',
                dynamicanimation          : 'androidx.dynamicanimation:dynamicanimation:1.1.0-alpha03',
                asynclayoutinflater       : "androidx.asynclayoutinflater:asynclayoutinflater:1.0.0",
                preference                : "androidx.preference:preference:1.1.1",
                material                  : 'com.google.android.material:material:1.5.0-alpha02',
                lottie                    : 'com.airbnb.android:lottie:6.0.0',

                core_ktx                  : 'androidx.core:core-ktx:1.3.1',
                kotlinx_coroutines_android: "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_version",
                kotlinx_coroutines_core   : "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_version",
                kotlin_reflect            : "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version",

                navigation_fragment_ktx   : 'androidx.navigation:navigation-fragment-ktx:2.4.0-alpha01',
                navigation_ui_ktx         : 'androidx.navigation:navigation-ui-ktx:2.4.0-alpha01',
                navigation_common_ktx     : 'androidx.navigation:navigation-common-ktx:2.4.0-alpha01',
                navigation_runtime_ktx    : 'androidx.navigation:navigation-runtime-ktx:2.4.0-alpha01',

                protobuf_java             : 'com.google.protobuf:protobuf-java:3.5.1',
                protoc                    : 'com.google.protobuf:protoc:3.5.1',

        ]
    }

    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
        }
        maven {
            url 'https://maven.aliyun.com/repository/central'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google'
        }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:7.2.2"
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.8.17'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.protobuf'

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.5.1'
    }

    generateProtoTasks {
        all().each { task ->
            task.builtins {
                remove java
            }
            task.builtins {
                java {}
            }
        }
    }
}

android {
    compileSdkVersion COMPILE_SDK

    defaultConfig {
        applicationId "com.android.permissioncontroller"
        minSdkVersion MIN_SDK_VERSION
        targetSdkVersion TARGET_SDK_VERSION
        versionCode 32
    }

    signingConfigs {
        platform {
            storeFile file("platform.keystore")
            storePassword '123456'
            keyAlias 'platform'
            keyPassword '123456'
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.platform
        }

        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.platform
        }

        applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = "PermissionController.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [
                '-Xjvm-default=all-compatibility'
        ]
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            proto.srcDirs = ['protos']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    compileOnly files('libs/framework.jar')
    compileOnly files('libs/libprotobuf-java-lite.jar')
    implementation files('libs/libprotobuf-java-nano.jar')
    implementation files('libs/permissioncontroller-statsd.jar')
    implementation files('libs/modules-utils-build_system.jar')

    implementation project(':SettingsLib:HelpUtils')
    implementation project(':SettingsLib:RestrictedLockUtils')
    implementation project(':SettingsLib:AppPreference')
    implementation project(':SettingsLib:SearchWidget')
    implementation project(':SettingsLib:LayoutPreference')
    implementation project(':SettingsLib:BarChartPreference')
    implementation project(':SettingsLib:ActionBarShadow')
    implementation project(':SettingsLib:ProgressBar')
    implementation project(':SettingsLib:CollapsingToolbarBaseActivity')
    implementation project(':SettingsLib:SettingsTheme')
    implementation project(':SettingsLib:FooterPreference')
    implementation project(':SettingsLib:RadioButtonPreference')
    implementation project(':SettingsLib:TwoTargetPreference')
    implementation project(':SettingsLib:Utils')
    implementation project(':iconloaderlib')
    implementation project(':car-ui-lib')

    implementation(libs.preference_leanback, {
        exclude group: 'androidx.preference', module: 'preference'
    })

    implementation libs.preference
    implementation libs.recyclerview
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.constraintlayout_solver
    implementation libs.leanback
    implementation libs.core_runtime
    implementation libs.lifecycle_extensions
    implementation libs.navigation_fragment_ktx
    implementation libs.navigation_ui_ktx
    implementation libs.navigation_common_ktx
    implementation libs.navigation_runtime_ktx

    implementation libs.protobuf_java
    implementation libs.protoc

    implementation libs.kotlinx_coroutines_android
    implementation libs.kotlinx_coroutines_core
    implementation libs.kotlin_reflect
    implementation libs.core_ktx
}

allprojects {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
        }
        maven {
            url 'https://maven.aliyun.com/repository/central'
        }
        maven {
            url 'https://maven.aliyun.com/repository/google'
        }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            if (options.bootstrapClasspath != null) {
                Set<File> fileSet = options.bootstrapClasspath.getFiles()
                List<File> newFileList = new ArrayList<>();
                newFileList.add(new File("./libs/framework.jar"))
                newFileList.addAll(fileSet)
                options.bootstrapClasspath = files(
                        newFileList.toArray()
                )
            }
        }
    }
}