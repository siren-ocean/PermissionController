allprojects { project ->
    project.plugins.withId("com.android.library") {
        applyReorderRule(project)
        applyDefaultConfig(project)
    }
    project.plugins.withId("com.android.application") {
        applyReorderRule(project)
        applyDefaultConfig(project)
    }
}

def applyReorderRule(Project project) {
    project.gradle.projectsEvaluated {
        project.tasks.matching { it.name == "compileDebugJavaWithJavac" }.configureEach { task ->
            task.doFirst {
                task.classpath = reorderClasspath(task.classpath.files)
            }
        }
        project.tasks.matching { it.name == "compileReleaseJavaWithJavac" }.configureEach { task ->
            task.doFirst {
                task.classpath = reorderClasspath(task.classpath.files)
            }
        }
    }
}

def reorderClasspath(Set<File> classpathSet) {
    def androidJar = classpathSet.find { it.name == "android.jar" }
    def others = classpathSet - (androidJar ? [androidJar] : [])
    return files((others + (androidJar ?: [])).toArray())
}

def applyDefaultConfig(Project project) {
    project.android {
        compileSdk COMPILE_SDK.toInteger()

        defaultConfig {
            minSdk MIN_SDK_VERSION.toInteger()
            targetSdk TARGET_SDK_VERSION.toInteger()
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
}